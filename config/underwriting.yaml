# Experiment 7 - the Underwriting Apprentice (decision D-01).
#
# One job repeated 38 times: rate a life-insurance application. Five arms, identical in
# every respect except what each is handed before it decides and what it keeps afterwards.
# Operators are fresh Claude Fable 5.1 subagents, one instance per request, answering
# through the manual-mode request/response file protocol. No API key, no SDK client.

# Every key below is read by the code. Settings that are NOT knobs used to sit here and
# were silently ignored; they have been removed, and this is where each one really lives:
#
#   experiment  - the experiment's identity is this file's header and the README.
#   seed        - src/underwriting/cases.py (SEED). The data pack is frozen against
#                 data/underwriting/freeze_manifest.json, so the seed cannot be a knob;
#                 the runner records the authoritative constant in run.json.
#   conditions  - src/underwriting/state.py (CONDITIONS). The five arms are also the
#                 graph's routing table, so they are code, not configuration.
#   phases      - src/underwriting/state.py (PHASES).
#   data_dir    - src/underwriting/data.py (UW_DATA_DIR). Moving the frozen pack would
#                 break the freeze check, so its location is not configurable.
#
# The five arms, for the reader: new_joiner (starter manual only; keeps nothing), notebook
# (+ every past markup verbatim, newest first), written_rules (+ its own rule book,
# rewritten by a reflection call after each case), precedent (+ the 3 nearest past cases
# with their correct answers), ask_senior (may ask questions first; keeps nothing).
# The two phases: train (30 cases, a reviewer markup after each) and holdout (8 cases,
# memories frozen, no markup).

mode: manual                      # manual | stub
operator: claude-code-subagent
# Operator model. The run uw_001 began on claude-fable-5-1 and every case logged before 2026-09-12 14:45
# carries that identifier. The Fable quota was exhausted account-wide with 37 calls left on two arms, and the
# lead chose to finish on Opus 5 rather than pause (D-02). Each case record carries the model that produced
# it, so the switch is visible per case in artifacts/uw/<run>/<arm>/cases.jsonl.
model_identifier: claude-opus-5
stub_operator: learner            # stub mode only: naive | learner

max_rerequests: 2                 # first request + 2 re-requests, then the answer is scored unparseable
precedent_k: 3
max_questions: 4                  # cap on the questions the senior oracle will answer (ask_senior arm)
trailing_window: 5                # default window for the summariser's trailing-case mean

poll_interval_seconds: 5
poll_timeout_seconds: 3600

artifacts_root: artifacts/uw
