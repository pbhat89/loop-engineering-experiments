      - check_id: T7.threshold_source
        dimension: statistical_discipline
        weight: 4
        critical: true
        kind: contract
        target: target_definition.threshold_source
        issue_type: wrong_threshold_source
        remediation: Compute the 95th-percentile threshold on the training partition only (threshold_source train_only); a threshold from all rows leaks the test distribution into the target.
        related_components: [{component: target_definition, params: {amount_column: paid_amount, percentile: 95, threshold_source: train_only}}]
        reusable: false
        applicable_task_ids: []
      - check_id: T7.threshold_value
        dimension: correctness
        weight: 3
        critical: false
        kind: tolerance
        target: target_definition.threshold_value
        issue_type: wrong_threshold_source
        remediation: With seed 42, test_size 0.25 and the training-only 95th percentile of paid_amount the threshold is fixed; check the amount column, percentile, split and source.
        related_components: [{component: target_definition, params: {amount_column: paid_amount, percentile: 95, threshold_source: train_only}}, {component: split, params: {test_size: 0.25}}]
        reusable: false
