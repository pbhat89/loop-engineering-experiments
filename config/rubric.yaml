# Frozen evaluation rubric (A3). Scored by src/evaluator.py against goldens/<task>.  No LLM judging.
# Scoring (LEAD §7 / plan §15): dimension = 4 x sum(weight * passed) / sum(weight) (2 dp); a dimension with no
# checks for a task is null and excluded; score_total = mean of the remaining dimensions (2 dp);
# passed = every critical check passed AND score_total >= pass_threshold.  A missing metric fails with observed null.
#
# Check grammar
#   kind: exact            target = dotted metric path; expected = golden.expected_exact[golden_key].
#                          Dicts match as subsets (every expected key present and equal), scalar lists match
#                          order-insensitively, lists of dicts match as multisets of subset-matching elements,
#                          floats within 1e-9 relative.
#   kind: tolerance        target = dotted metric path (a dict node with "value" is unwrapped);
#                          expected = golden.expected_metrics[golden_key] = {value|values, tolerance, definition}.
#                          A dict of expected numbers is compared key by key.
#   kind: artifact_exists  target = artifact file name; passes when the file is listed in execution_result.artifacts
#                          (or metrics_path / report_path / output_dir) AND exists on disk under the repo root.
#   kind: field_excluded   target = dotted path to a list (or dict, whose keys are used) of feature names, or
#                          "plan:<component>.<param>"; passes when it shares nothing with golden.prohibited_fields
#                          (optionally narrowed by the check's `fields` list).
#   kind: contract         target = dotted metric path; expected = golden.contracts[golden_key]: a scalar (string-form
#                          equality), {includes: [...]}, {any_of: [...]}, {each_has: [...]}, {min_count: n, from: [...]},
#                          {equals_metric: <path>}, {present: true}; an optional `field` projects a list of dicts.
#   kind: caveat_keywords  target = caveat id; expected = golden.required_caveats[id].any_of; passes when the id is in
#                          metrics.report.caveats or any keyword occurs (case-insensitive) in report.md
#                          (T8: also executive_brief.md).
#   kind: metric_range     target = dotted metric path ("*" expands over dict keys); expected =
#                          golden.metric_ranges[golden_key] = {min, max}; a bound may be a metric path.
#   kind: report_structure target = "<file>#section:<Heading>" | "<file>#pattern:<denominator_format|source_citation>"
#                          | "<file>#forbidden_phrases" (golden.forbidden_phrases) | "<file>#max_words:<n>".
#   kind: component_executed target = component id; passes when it is in execution_result.components_executed.
# golden_key defaults to target; it is set only where two checks share one metric path.
# related_components carry the exact component/params fix the operator (or the stub) can apply literally.
rubric_version: "1"
pass_threshold: 3.5
evaluator_version: "1.0"

dimensions:
  - id: correctness
    description: Golden values (exact or within tolerance) and the analytical conventions that determine them.
  - id: completeness
    description: Required components executed, required artifacts present, required scope covered.
  - id: reproducibility
    description: Seed, split and threshold recorded; every required artifact and feature list saved.
  - id: statistical_discipline
    description: Denominators, small-group handling, leakage and protected-attribute exclusions, stratification, train-only fitting, prevalence.
  - id: communication
    description: Required caveats, denominators shown, artifacts cited, no causal phrasing, brief structure.

