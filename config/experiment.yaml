# Experiment configuration — claims-skill-loop (owner: A1; experiment 4 values set by the lead, decision D-22).
# Keys are those fixed in docs/LEAD_DESIGN_DECISIONS.md §12 plus the experiment-3 feedback/library knobs.
# Every condition reads this same file; per-condition differences are routes and memory only (config/graph.yaml).

seed: 42
# Experiment 5 v2 (D-24): the held-out transfer test, redesigned. Three arms, three tasks none of the arms has ever
# seen, and the two memory arms start *warm* - seeded from run_006's memory (feedback_memory) and learned skills
# (skill_learning). reflection_only is the cold control (checker feedback, no memory). No self-review arms.
# v1 (run_007, [T9, T10, T5, T6]) hit a ceiling: the cold arm's first attempts already scored 3.09-3.68. v2 uses
# three *convention-dense* tasks whose conventions are all covered by the run_006 memory, and freezes the memory
# for the duration of the test (memory_read_only below) so run_008 is a pure evaluation of what was carried in.
conditions: [reflection_only, feedback_memory, skill_learning]
task_order: [T11, T12, T13]             # portfolio deep-dive -> high-cost model at p90 -> brief for the CFO
# experiment 5 v1 (D-23) order, kept for the record: [T9, T10, T5, T6]
# experiment 4 (D-22) order, kept for the record: [T1, T2, T4, T3, T7, T8]

# Carry-over of memory (experiment 5). `seed_from_run` is read-only: nothing in that run's files is modified.
#   * feedback_memory  <- artifacts/memory/run_006/feedback_memory.jsonl, every numeric token redacted to [n]
#   * skill_learning   <- skills/evolved/run_006/*.md, listed read-only alongside this run's own skills
# `task_index_offset` continues the task numbering of run_006 (indices 0-5), so this run's tasks are indices 6+:
# the seeded skills (created after indices 0 and 1) are eligible from the first task. `remaining_task_ids` is
# unaffected. Unchanged from run_007: the seeded raw log is run_006's 19 redacted notes, not run_007's own log.
seed_from_run: run_006
task_index_offset: 6
seed_skill_exclude: []                  # seeded skill ids the leakage audit (scripts/seed_audit.py) forces out

# Frozen memory (experiment 5 v2, D-24). The carried-over memory is read-only for the whole run: `finalize_task`
# appends nothing to artifacts/memory/<run_id>/<condition>.jsonl (it logs a `memory_write_skipped` skill event
# with reason `read_only` instead) and `skill_learning` never reflects-for-learning or proposes a skill - after
# the last attempt of a task it routes straight to `completed`. Retrieval is untouched: the warm arms still read
# the seeded notes and the seeded skills before planning. run_008 therefore measures only what run_006 left
# behind, with no learning inside the test itself.
memory_read_only: true

# Stopping rules (brief Addendum B, widened for experiment 3 and unchanged in experiment 4)
max_retries: 4                          # five attempts per task
pass_threshold: 3.5                     # must equal config/rubric.yaml pass_threshold (asserted by test)
max_operator_steps_per_condition: 64    # every operator request file written counts, re-requests included

# What the operator is shown after each attempt (experiment 3; unchanged in experiment 4)
feedback_max_items: 3                   # only the three most severe failed checks are reported; the rest is a count
reveal_fixes: false                     # the literal component/parameter fix is withheld (manual mode only; fixtures always see it)
# The memory arms additionally carry artifacts/memory/<run_id>/<condition>.jsonl into plan_task / revise_plan (D-22).

# Skills
foundational_skills: false              # start from an empty library: every retrieved skill was learned inside the run
retrieval_k: 8
duplicate_similarity_threshold: 0.6     # token-Jaccard over objective + procedure

# Data snapshot (one-time download by src/download_data.py; no network afterwards)
dataset:
  repo: xpertsystems/hlt008-sample
  revision: 7309ddb30e67468748b7aa9182d8517fe28c2f9c
  files: [members.csv, providers.csv, medical_claims.csv, pharmacy_claims.csv, adherence.csv]

# Phase 1.5 freeze: SHA-256 of tasks.yaml, rubric.yaml, every golden file, every raw data file
freeze_manifest: config/freeze_manifest.json

# Runtime (no model API calls in manual or stub mode)
default_mode: manual                    # manual | stub | rule_learner | anthropic_api (anthropic_api is not used in this study)
model_identifier: claude-haiku-4-5-20251001   # record-only in manual mode: the Claude Code subagent model acting as operator (experiments 3-4)
operator: claude-code-subagent          # stateless experiment-operator-blind subagent, one per request

# Observability
dashboard_refresh_seconds: 30
