# Experiment configuration — claims-skill-loop (owner: A1).
# Keys are exactly those fixed in docs/LEAD_DESIGN_DECISIONS.md §12; add new keys only via a lead decision.
# All three conditions read this same file; per-condition differences are routes only (config/graph.yaml).

seed: 42
conditions: [baseline, reflection_only, skill_learning]
task_order: [T1, T2, T3, T4, T5, T6, T7, T8]

# Stopping rules (brief Addendum B)
max_retries: 2                          # three attempts per task
pass_threshold: 3.5                     # must equal config/rubric.yaml pass_threshold (asserted by test)
max_operator_steps_per_condition: 64    # every operator request file written counts, re-requests included

# Skills
retrieval_k: 6
duplicate_similarity_threshold: 0.6     # token-Jaccard over objective + procedure

# Data snapshot (one-time download by src/download_data.py; no network afterwards)
dataset:
  repo: xpertsystems/hlt008-sample
  revision: 7309ddb30e67468748b7aa9182d8517fe28c2f9c
  files: [members.csv, providers.csv, medical_claims.csv, pharmacy_claims.csv, adherence.csv]

# Phase 1.5 freeze: SHA-256 of tasks.yaml, rubric.yaml, every golden file, every raw data file
freeze_manifest: config/freeze_manifest.json

# Runtime (no model API calls in manual or stub mode)
default_mode: manual                    # manual | stub | anthropic_api (anthropic_api is not used in this study)
model_identifier: claude-fable-5-1      # record-only in manual mode: the Claude Code session model acting as operator
operator: claude-code-subagent          # stateless experiment-operator subagent, one per request

# Observability
dashboard_refresh_seconds: 30
