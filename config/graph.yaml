# Documentation mirror of the compiled LangGraph in src/claims_graph.py (v4, experiment 4).
# One graph serves every condition; routing functions read state["condition"] and the `next_route`
# decision recorded by evaluate_output / self_evaluate / validate_skill. tests/test_graph_routes.py asserts
# that `nodes`, `edges` and `per_condition` below equal src.claims_graph.designed_topology() and that the
# edge set equals the compiled graph's edges. This file never drives execution.

graph_version: "4"

nodes:
  - load_context
  - retrieve_skills
  - plan_task
  - execute_task
  - evaluate_output
  - self_evaluate
  - reflect_on_feedback
  - revise_plan
  - propose_skill
  - validate_skill
  - revise_skill_proposal
  - persist_skill
  - finalize_task

# Nodes that call provider.decide() and therefore interrupt in manual mode
llm_decision_nodes: [plan_task, revise_plan, reflect_on_feedback, propose_skill, revise_skill_proposal, self_evaluate]

# Union of static and conditional edges (label = routing condition; empty = static edge)
edges:
  - {source: START, target: load_context, label: ""}
  - {source: load_context, target: retrieve_skills, label: "skill_learning | foundational_only"}
  - {source: load_context, target: plan_task, label: "baseline | reflection_only | feedback_memory | self_refine | self_refine_memory"}
  - {source: retrieve_skills, target: plan_task, label: ""}
  - {source: plan_task, target: execute_task, label: ""}
  - {source: execute_task, target: evaluate_output, label: ""}
  - {source: evaluate_output, target: finalize_task, label: "completed"}
  - {source: evaluate_output, target: revise_plan, label: "retry (baseline)"}
  - {source: evaluate_output, target: reflect_on_feedback, label: "retry (reflection_only, feedback_memory, skill_learning) | learn (skill_learning)"}
  - {source: evaluate_output, target: self_evaluate, label: "self_evaluate (self_refine, self_refine_memory)"}
  - {source: self_evaluate, target: revise_plan, label: "retry (operator verdict: revise)"}
  - {source: self_evaluate, target: finalize_task, label: "completed (operator verdict: accept)"}
  - {source: reflect_on_feedback, target: revise_plan, label: "retry"}
  - {source: reflect_on_feedback, target: propose_skill, label: "learn"}
  - {source: revise_plan, target: execute_task, label: ""}
  - {source: propose_skill, target: validate_skill, label: ""}
  - {source: validate_skill, target: persist_skill, label: "accepted"}
  - {source: validate_skill, target: revise_skill_proposal, label: "retry_revision"}
  - {source: validate_skill, target: finalize_task, label: "rejected"}
  - {source: revise_skill_proposal, target: validate_skill, label: ""}
  - {source: persist_skill, target: finalize_task, label: ""}
  - {source: finalize_task, target: END, label: ""}

routers:
  route_after_load:
    source: load_context
    targets: [retrieve_skills, plan_task]
    rule: "retrieve_skills when condition in {skill_learning, foundational_only}; otherwise plan_task"
  route_after_evaluation:
    source: evaluate_output
    targets: [finalize_task, revise_plan, reflect_on_feedback, self_evaluate]
    rule: >-
      evaluate_output stores next_route: 'retry' when not passed and retry_count < max_retries and operator budget remains;
      otherwise 'learn' (skill_learning) or 'completed' (baseline, reflection_only, feedback_memory, foundational_only).
      the self-review arms (self_refine, self_refine_memory) ignore the verdict for routing: 'self_evaluate' while
      attempts remain, else 'completed'.
      retry -> revise_plan for baseline, reflect_on_feedback for every other condition; learn -> reflect_on_feedback;
      self_evaluate -> self_evaluate; completed -> finalize_task
  route_after_self_evaluation:
    source: self_evaluate
    targets: [revise_plan, finalize_task]
    rule: "operator verdict 'revise' -> next_route 'retry' -> revise_plan; 'accept' (or invalid response / operator cap) -> finalize_task"
  route_after_reflection:
    source: reflect_on_feedback
    targets: [revise_plan, propose_skill]
    rule: "next_route == 'retry' -> revise_plan; otherwise propose_skill (learn path, skill_learning only)"
  route_after_validation:
    source: validate_skill
    targets: [persist_skill, revise_skill_proposal, finalize_task]
    rule: >-
      next_route = validation decision. A null proposal is validated as 'rejected'. 'retry_revision' is offered at most once per task
      and only while operator budget remains; afterwards it becomes 'rejected'.

# Nodes reachable per condition (the traversable subset of the single graph)
per_condition:
  baseline: [load_context, plan_task, execute_task, evaluate_output, revise_plan, finalize_task]
  reflection_only: [load_context, plan_task, execute_task, evaluate_output, reflect_on_feedback, revise_plan, finalize_task]
  skill_learning: [load_context, retrieve_skills, plan_task, execute_task, evaluate_output, reflect_on_feedback, revise_plan,
                   propose_skill, validate_skill, revise_skill_proposal, persist_skill, finalize_task]
  foundational_only: [load_context, retrieve_skills, plan_task, execute_task, evaluate_output, reflect_on_feedback, revise_plan, finalize_task]
  self_refine: [load_context, plan_task, execute_task, evaluate_output, self_evaluate, revise_plan, finalize_task]
  feedback_memory: [load_context, plan_task, execute_task, evaluate_output, reflect_on_feedback, revise_plan, finalize_task]
  self_refine_memory: [load_context, plan_task, execute_task, evaluate_output, self_evaluate, revise_plan, finalize_task]

# Raw cross-task memory (experiment 4, decision D-22). Two arms only; no extra nodes, no extra routes.
memory:
  arms:
    feedback_memory: "reflection_only plus a verbatim log of the checker findings the operator was shown (evaluation.feedback_shown, all attempts)"
    self_refine_memory: "self_refine plus a verbatim log of the operator's own review findings (self_evaluation_history[*].findings, with each review's verdict and summary); it still never sees the evaluator"
  file: "artifacts/memory/<run_id>/<condition>.jsonl"
  written_by: finalize_task           # skill event `memory_written`
  recalled_by: load_context           # skill event `memory_retrieved`; state key `past_feedback`
  shown_in: [plan_task, revise_plan]  # payload keys `past_feedback` and `past_feedback_note`
  recall_order: "most recent first, records from other tasks only"
  recall_limit: 30
  distillation: none                  # appended verbatim, never filtered for relevance, never turned into a skill

# What the operator is shown per attempt (experiment 3, decision D-21; values duplicated from experiment.yaml)
feedback:
  feedback_max_items: 3            # the three most severe failed checks (critical first, then rubric weight); the rest is a count
  reveal_fixes: false              # the literal component/parameter fix (`related_components`) is withheld from the operator
  self_refine_sees_evaluator: false     # applies to self_refine and self_refine_memory alike

# Retry / termination rules (brief Addendum B; docs/plan.md). Values duplicated from experiment.yaml are asserted equal by test.
termination:
  pass_rule: "all critical checks pass and score_total >= pass_threshold -> finalize_task immediately (stop_reason: passed)"
  max_retries: 4
  retry_exhausted_rule: "retry_count == max_retries and not passed -> finalize (stop_reason: retry_budget_exhausted); skill_learning still reflects and may propose"
  self_refine_stop_rule: "in self_refine and self_refine_memory the operator's own verdict ends the loop (stop_reason: self_accepted) or the attempt cap does; the frozen evaluator's pass/fail is recorded but never routes"
  max_operator_steps_per_condition: 64
  operator_cap_rule: >-
    when operator_steps_used >= cap no request is issued: plan_task uses catalogue defaults, revise_plan keeps the prior plan,
    reflect_on_feedback is empty, self_evaluate accepts, propose_skill returns null, and no further retries are routed (a retry needs an operator);
    stop_reason: operator_cap
  max_operator_validation_rerequests_per_node: 2
  max_skill_proposal_revisions: 1
  skill_proposal_min_applicable_remaining_tasks: 2
  execution_timeout_seconds: 300        # per attempt, cooperative deadline inside task_runner.execute; expiry -> status partial, error type timeout
  all_conditions_run_all_tasks: true
  stop_reasons: [passed, retry_budget_exhausted, self_accepted, operator_cap]
